# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  path_filters:
    - "!Cargo.lock"
    - "!target/**"
    - "!coverage/**"
    - "!CHANGELOG.md"
  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Public items need rustdoc covering the contract: purpose, invariants,
        errors, panics, and an example where it helps. Inline `//` comments are
        only warranted for a why the code cannot state (a workaround and its
        reason, a drop-order dependency, a deliberate fail-closed choice).
        Flag inline comments that restate what the code does or describe a
        dependency's internals.

        This library is an axum extractor (`RailsCookie`) that decrypts Rails
        encrypted session cookies (AES-HMAC or AES-GCM) via `message_verifier`.
        The salt constants must match Rails defaults. `CookieConfig`'s Debug
        and Display must never print the name or secret, and errors must not
        carry the secret or decrypted data. The extractor never rejects or
        panics: every failure maps to a `RailsCookieError` variant, which is
        `#[non_exhaustive]`. `RailsCookie` and `CookieAlgorithm` must stay
        exhaustive, so a new variant there is breaking.
        rustfmt uses 2-space indents and max_width 100.

        Do not comment on style that `cargo fmt` or
        `cargo clippy --all-targets --all-features -- -D warnings` already
        enforces.
    - path: "tests/**/*.rs"
      instructions: |
        Check that tests assert behavior rather than restating the
        implementation, and that new public API or bugfixes come with
        coverage.
    - path: ".github/workflows/**"
      instructions: |
        Every third-party action must be pinned to a full commit SHA with the
        version in a trailing comment (`uses: owner/action@<sha> # vX.Y.Z`).
        release.yml is hand-maintained: dist can't generate a release workflow for
        a library crate, so don't suggest regenerating it. dist alone creates GitHub Releases (release-plz.toml keeps `git_release_enable = false`).
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Stacked PRs target the branch below them, not just master.
    base_branches:
      - ".*"
  tools:
    clippy:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true

chat:
  art: false
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
